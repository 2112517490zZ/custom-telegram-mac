name: Mac Intel Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  macos:
    name: MacOS Intel
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      UPLOAD_ARTIFACT: "true"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      UPSTREAM_SHA: "f4be0fac81507efa591db397489e255143a0c321"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,pch_defines,include_file_mtime
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: overlay
          fetch-depth: 1

      - name: Clone 64Gram
        uses: actions/checkout@v4
        with:
          repository: TDesktop-x64/tdesktop
          ref: ${{ env.UPSTREAM_SHA }}
          submodules: recursive
          fetch-depth: 1
          path: tdesktop

      - name: Apply custom features
        run: |
          set -euo pipefail
          cd tdesktop
          git apply --check --whitespace=nowarn ../overlay/patches/0001-custom-features.patch
          git apply --whitespace=nowarn ../overlay/patches/0001-custom-features.patch
          test -f Telegram/SourceFiles/custom/custom_import.cpp
          test -f Telegram/SourceFiles/custom/custom_export.cpp
          test -f Telegram/SourceFiles/custom/custom_account_rail.cpp
          test -f Telegram/SourceFiles/custom/custom_search_panel.cpp
          echo "patch applied"

      - name: Homebrew cache
        id: cache-brew
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Logs/Homebrew
          key: brew-${{ runner.os }}-v1

      - name: First set up
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          sudo chown -R `whoami`:admin /usr/local/share || true
          brew install automake libtool meson nasm ninja pkg-config ccache
          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake || true

      - name: Save Homebrew cache
        if: steps.cache-brew.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Logs/Homebrew
          key: brew-${{ runner.os }}-v1

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-libs-debug-${{ env.UPSTREAM_SHA }}-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            ${{ runner.os }}-libs-debug-${{ env.UPSTREAM_SHA }}-
            ${{ runner.os }}-libs-debug-
            ${{ runner.os }}-libs-

      - name: Libraries cache status
        run: |
          if [ "${{ steps.cache-libs.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::Libraries cache HIT"
          else
            echo "::notice::Libraries cache MISS — full prepare, then save before compile"
          fi

      - name: Libraries
        run: |
          ./tdesktop/Telegram/build/prepare/mac.sh skip-release silent

      - name: Free up some disk space
        run: |
          find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete
          du -sh Libraries ThirdParty || true

      - name: Save Libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-libs-debug-${{ env.UPSTREAM_SHA }}-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}

      - name: Compile cache (ccache)
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-debug-${{ env.UPSTREAM_SHA }}-${{ hashFiles('overlay/patches/0001-custom-features.patch') }}
          restore-keys: |
            ${{ runner.os }}-ccache-debug-${{ env.UPSTREAM_SHA }}-
            ${{ runner.os }}-ccache-debug-

      - name: Compile cache status
        run: |
          if [ "${{ steps.cache-ccache.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::ccache HIT"
          else
            echo "::notice::ccache MISS — cold compile"
          fi
          ccache --zero-stats || true
          ccache -s || true

      - name: Telegram Desktop build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          set -euo pipefail
          cd tdesktop/Telegram
          echo "ARTIFACT_NAME=CustomTelegram" >> "$GITHUB_ENV"
          ls -l ../../Libraries/local/Qt-*/lib/*.a | head
          CLANG="$(xcrun --find clang)"
          CLANGXX="$(xcrun --find clang++)"
          WRAP="${RUNNER_TEMP}/ccache-wrappers"
          mkdir -p "$WRAP"
          # Xcode treats CC as one executable path. "ccache /path/clang" is not a path.
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$CLANG" > "$WRAP/clang"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$CLANGXX" > "$WRAP/clang++"
          chmod +x "$WRAP/clang" "$WRAP/clang++"
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D CMAKE_OSX_ARCHITECTURES=x86_64 \
            -D DESKTOP_APP_MAC_ARCH=x86_64 \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_CC="$WRAP/clang" \
            -D CMAKE_XCODE_ATTRIBUTE_CXX="$WRAP/clang++" \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ../out --config Debug --parallel
          ccache -s

      - name: Save compile cache
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-debug-${{ env.UPSTREAM_SHA }}-${{ hashFiles('overlay/patches/0001-custom-features.patch') }}

      - name: Move artifact
        run: |
          cd tdesktop/out/Debug
          mkdir -p artifact
          mv Telegram.app artifact/ || mv 64Gram.app artifact/ || ls -la
          ls -la artifact || true

      - uses: actions/upload-artifact@v4
        name: Upload artifact
        with:
          name: CustomTelegram
          path: tdesktop/out/Debug/artifact/
          retention-days: 14
