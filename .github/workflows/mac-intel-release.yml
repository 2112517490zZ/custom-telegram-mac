name: Mac Intel Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  macos:
    name: MacOS Intel
    # macos-latest is an M1 with 7 GB RAM. This job compiles x86_64,
    # and that machine swaps until clang stops returning.
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      UPLOAD_ARTIFACT: "true"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      UPSTREAM_SHA: "f4be0fac81507efa591db397489e255143a0c321"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,pch_defines,include_file_mtime
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: overlay
          fetch-depth: 1

      - name: Clone 64Gram
        uses: actions/checkout@v4
        with:
          repository: TDesktop-x64/tdesktop
          ref: ${{ env.UPSTREAM_SHA }}
          submodules: recursive
          fetch-depth: 1
          path: tdesktop

      - name: Apply custom features
        run: |
          set -euo pipefail
          cd tdesktop
          git apply --check --whitespace=nowarn ../overlay/patches/0001-custom-features.patch
          git apply --whitespace=nowarn ../overlay/patches/0001-custom-features.patch
          test -f Telegram/SourceFiles/custom/custom_import.cpp
          test -f Telegram/SourceFiles/custom/custom_export.cpp
          test -f Telegram/SourceFiles/custom/custom_account_rail.cpp
          test -f Telegram/SourceFiles/custom/custom_search_panel.cpp
          echo "patch applied"

      - name: Patch prepare.py for Intel
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          p = Path("tdesktop/Telegram/build/prepare/prepare.py")
          text = p.read_text()
          old = r'''mac:
              cmake . \\
                  -D CMAKE_OSX_ARCHITECTURES="x86_64;arm64" \\
                  -D CMAKE_INSTALL_PREFIX:STRING=$USED_PREFIX \\
                  ${cmake_defines}'''
          new = r'''mac:
              python3 -c "from pathlib import Path; p=Path('third_party/skcms.cmake'); t=p.read_text(); old=';-march=x86-64;'; assert old in t, 'libjxl skcms march flag missing'; p.write_text(t.replace(old, ';'))"
              cmake . \\
                  -D CMAKE_OSX_ARCHITECTURES="x86_64" \\
                  -D CMAKE_INSTALL_PREFIX:STRING=$USED_PREFIX \\
                  ${cmake_defines}'''
          if text.count(old) != 1:
              raise SystemExit(f"libjxl mac block count={text.count(old)}")
          text = text.replace(old, new, 1)

          # The app is x86_64. Skip the arm64 Rust slice so the last library
          # does not cross-compile a second release staticlib.
          old_tlottie = """    buildOneArch aarch64-apple-darwin
              buildOneArch x86_64-apple-darwin
              mkdir -p $USED_PREFIX/lib $USED_PREFIX/include/tlottie
              lipo -create target/aarch64-apple-darwin/release/libtlottie.a target/x86_64-apple-darwin/release/libtlottie.a -output $USED_PREFIX/lib/libtlottie.a"""
          new_tlottie = """    buildOneArch x86_64-apple-darwin
              mkdir -p $USED_PREFIX/lib $USED_PREFIX/include/tlottie
              cp target/x86_64-apple-darwin/release/libtlottie.a $USED_PREFIX/lib/libtlottie.a"""
          if text.count(old_tlottie) != 1:
              raise SystemExit(f"tlottie mac block count={text.count(old_tlottie)}")
          text = text.replace(old_tlottie, new_tlottie, 1)

          old_rust = "        --target aarch64-apple-darwin \\\\\n"
          if text.count(old_rust) != 1:
              raise SystemExit(f"rust aarch64 target count={text.count(old_rust)}")
          text = text.replace(old_rust, "", 1)

          p.write_text(text)
          print("prepare patched: libjxl x86_64, tlottie x86_64 only")
          PY

      - name: Homebrew cache
        id: cache-brew
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Logs/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-v1

      - name: First set up
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          sudo chown -R `whoami`:admin /usr/local/share || true
          brew install automake libtool meson nasm ninja pkg-config ccache
          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake \
            || sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /usr/local/share/cmake/Modules/Compiler/GNU.cmake \
            || true

      - name: Save Homebrew cache
        if: steps.cache-brew.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Logs/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-libs-debug-${{ env.UPSTREAM_SHA }}-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-libs-debug-${{ env.UPSTREAM_SHA }}-
            ${{ runner.os }}-${{ runner.arch }}-libs-debug-

      - name: Libraries cache status
        run: |
          if [ "${{ steps.cache-libs.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::Libraries cache HIT"
          else
            echo "::notice::Libraries cache MISS — full prepare, then save before compile"
          fi

      - name: Free disk before libraries
        run: |
          set -eux
          df -h /
          rm -rf "$HOME/Library/Developer/CoreSimulator/Caches" || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" || true
          rm -rf "$HOME/Library/Developer/Xcode/Archives" || true
          rm -rf "$HOME/Library/Developer/Xcode/iOS DeviceSupport" || true
          rm -rf "$HOME/Library/Developer/Xcode/watchOS DeviceSupport" || true
          rm -rf "$HOME/Library/Developer/Xcode/tvOS DeviceSupport" || true
          sudo rm -rf /usr/local/lib/android || true
          df -h /

      - name: Libraries
        timeout-minutes: 300
        run: |
          set -euo pipefail
          defaults write com.apple.dt.Xcode IDEBuildOperationMaxNumberOfConcurrentCompileTasks -int 3
          LOG="$RUNNER_TEMP/libraries.log"
          touch "$LOG"
          # git clone writes nothing after "Cloning into" when stderr is not a
          # tty. Run 39455898625 died here: tlottie's clone was still in
          # git-remote-http, and the 8-minute watchdog treated silence as a hang.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/git" << 'EOF'
          #!/bin/bash
          real=/usr/local/bin/git
          if [ ! -x "$real" ]; then
            real=/usr/bin/git
          fi
          if [ "${1:-}" != "clone" ]; then
            exec "$real" "$@"
          fi
          attempt=1
          while [ "$attempt" -le 4 ]; do
            echo "git clone attempt ${attempt}: $*"
            if "$real" -c http.version=HTTP/1.1 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 clone --progress "${@:2}"; then
              exit 0
            fi
            status=$?
            echo "git clone attempt ${attempt} failed status=${status}"
            dest=""
            for arg in "${@:2}"; do
              case "$arg" in
                -*) ;;
                *) dest="$arg" ;;
              esac
            done
            if [ -n "$dest" ] && [[ "$dest" != *"://"* ]] && [ -d "$dest" ]; then
              echo "removing partial clone $dest"
              rm -rf "$dest"
            elif [ -n "$dest" ] && [[ "$dest" == *"://"* ]]; then
              base=$(basename "$dest" .git)
              if [ -d "$base" ]; then
                echo "removing partial clone $base"
                rm -rf "$base"
              fi
            fi
            attempt=$((attempt + 1))
            sleep 15
          done
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/bin/git"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export GIT_TERMINAL_PROMPT=0
          export PYTHONUNBUFFERED=1
          export CARGO_TERM_VERBOSE=true
          # OpenSSL prints a full cc command for every file. After about 2 MB,
          # GitHub stops reading the step log and clang blocks on that pipe.
          ./tdesktop/Telegram/build/prepare/mac.sh skip-release silent >"$LOG" 2>&1 &
          pid=$!
          last=0
          still=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 30
            now=$(wc -c <"$LOG" | tr -d ' ')
            echo "$(date -u +%H:%M:%S) libraries pid=$pid bytes=$now"
            if [ "$now" = "$last" ]; then
              still=$((still + 30))
              if [ "$still" -ge 180 ]; then
                echo "quiet ${still}s, last log line:"
                tail -n 1 "$LOG" | cut -c1-180
              fi
            else
              still=0
              last=$now
            fi
            if [ "$still" -ge 1200 ]; then
              echo "libraries produced no output for 20 minutes"
              tail -n 60 "$LOG" | cut -c1-200
              echo "---- error lines ----"
              grep -E "error:|FAILED|fatal:" "$LOG" | tail -n 30 || true
              kill "$pid" 2>/dev/null || true
              wait "$pid" || true
              exit 1
            fi
          done
          set +e
          wait "$pid"
          code=$?
          set -e
          echo "libraries exit $code bytes=$(wc -c <"$LOG" | tr -d ' ')"
          tail -n 40 "$LOG" | cut -c1-200
          exit "$code"

      - name: Free up some disk space
        run: |
          find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete
          du -sh Libraries ThirdParty || true

      - name: Save Libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-libs-debug-${{ env.UPSTREAM_SHA }}-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}

      - name: Compile cache (ccache)
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-debug-${{ env.UPSTREAM_SHA }}-${{ hashFiles('overlay/patches/0001-custom-features.patch') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-debug-${{ env.UPSTREAM_SHA }}-
            ${{ runner.os }}-${{ runner.arch }}-ccache-debug-

      - name: Compile cache status
        run: |
          if [ "${{ steps.cache-ccache.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::ccache HIT"
          else
            echo "::notice::ccache MISS — cold compile"
          fi
          ccache --zero-stats || true
          ccache -s || true

      - name: Telegram Desktop build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          set -euo pipefail
          cd tdesktop/Telegram
          echo "ARTIFACT_NAME=CustomTelegram" >> "$GITHUB_ENV"
          ls -l ../../Libraries/local/Qt-*/lib/*.a | head
          CLANG="$(xcrun --find clang)"
          CLANGXX="$(xcrun --find clang++)"
          WRAP="${RUNNER_TEMP}/ccache-wrappers"
          mkdir -p "$WRAP"
          # Xcode treats CC as one executable path. "ccache /path/clang" is not a path.
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$CLANG" > "$WRAP/clang"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$CLANGXX" > "$WRAP/clang++"
          chmod +x "$WRAP/clang" "$WRAP/clang++"
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D CMAKE_OSX_ARCHITECTURES=x86_64 \
            -D DESKTOP_APP_MAC_ARCH=x86_64 \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_CC="$WRAP/clang" \
            -D CMAKE_XCODE_ATTRIBUTE_CXX="$WRAP/clang++" \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          LOG="$RUNNER_TEMP/telegram-build.log"
          touch "$LOG"
          cmake --build ../out --config Debug --parallel >"$LOG" 2>&1 &
          pid=$!
          last=0
          still=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 30
            now=$(wc -c <"$LOG" | tr -d ' ')
            echo "$(date -u +%H:%M:%S) telegram pid=$pid bytes=$now"
            if [ "$now" = "$last" ]; then
              still=$((still + 30))
            else
              still=0
              last=$now
            fi
            if [ "$still" -ge 1200 ]; then
              echo "telegram build produced no output for 20 minutes"
              tail -n 40 "$LOG" | cut -c1-200
              kill "$pid" 2>/dev/null || true
              wait "$pid" || true
              exit 1
            fi
          done
          set +e
          wait "$pid"
          code=$?
          set -e
          echo "telegram build exit $code bytes=$(wc -c <"$LOG" | tr -d ' ')"
          tail -n 50 "$LOG" | cut -c1-200
          ccache -s
          exit "$code"

      - name: Save compile cache
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-debug-${{ env.UPSTREAM_SHA }}-${{ hashFiles('overlay/patches/0001-custom-features.patch') }}

      - name: Move artifact
        run: |
          cd tdesktop/out/Debug
          mkdir -p artifact
          mv Telegram.app artifact/ || mv 64Gram.app artifact/ || ls -la
          ls -la artifact || true

      - uses: actions/upload-artifact@v4
        name: Upload artifact
        with:
          name: CustomTelegram
          path: tdesktop/out/Debug/artifact/
          retention-days: 14
